server:
  port: 8083

spring:
  datasource:
    url: jdbc:mariadb://localhost:3308/history?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  mvc:
    cors:
      allowed-origins: "http://localhost:8081"
      allowed-methods: "GET, POST, PUT, DELETE"
      allowed-headers: "*"
      allow-credentials: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.apitester.history.dto

history:
  user-recent-count: 5
  auth-url: http://localhost:8081/api/auth/validate