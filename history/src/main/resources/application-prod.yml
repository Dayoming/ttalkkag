server:
  port: 8083

spring:
  datasource:
    url: jdbc:mariadb://192.168.50.130:3308/history?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  mvc:
    cors:
      allowed-origins: "http://192.168.50.130:8081"
      allowed-methods: "GET, POST, PUT, DELETE"
      allowed-headers: "*"
      allow-credentials: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            trusted.packages: "*"
            type.mapping: "jwtValidationRequest:com.apitester.history.dto.JwtValidationRequest,
            apiHistoryExternalResponse:com.apitester.history.dto.ApiHistoryExternalResponse"
    consumer:
      group-id: history-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted.packages: "*"
            type.mapping: "apiChangeHistoryMessage:com.apitester.history.dto.ApiChangeHistoryMessage,
            jwtValidationResponse:com.apitester.history.dto.JwtValidationResponse,
            apiHistoryExternalRequest:com.apitester.history.dto.ApiHistoryExternalRequest"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.apitester.history.dto

history:
  user-recent-count: 5
  auth-url: http://192.168.50.130:8081/api/auth/validate