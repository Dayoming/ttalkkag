server:
  port: 8081
spring:
  main:
    web-application-type: servlet
  application:
    name: ttalkkag
  messages:
    basename: messages
    encoding: UTF-8
    file-extension: yml
  datasource:
    url: jdbc:mariadb://localhost:3308/ttalkkag
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: 1234
    hikari:
      validation-timeout: '5000'
      idle-timeout: '300000'
      maximum-pool-size: '10'
      max-lifetime: '1800000'
      connection-test-query: SELECT 1
      minimum-idle: '5'
  jpa:
    hibernate:
      ddl-auto: update
  redis:
    host: localhost
    port: 6379
    password: ${redis.password}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            trusted.packages: "*"
            type.mapping: "apiChangeHistoryMessage:com.apitester.ttalkkag.dto.ApiChangeHistoryMessage,
            jwtValidationResponse:com.apitester.ttalkkag.dto.JwtValidationResponse,
            apiHistoryExternalRequest:com.apitester.ttalkkag.dto.ApiHistoryExternalRequest"
    consumer:
      group-id: ttalkkag-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted.packages: "*"
            type.mapping: "jwtValidationRequest:com.apitester.ttalkkag.dto.JwtValidationRequest,
            apiHistoryExternalResponse:com.apitester.ttalkkag.dto.ApiHistoryExternalResponse"

