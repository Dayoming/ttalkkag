services:
  db:
    image: mariadb:11.5
    container_name: mariadb_container
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: ttalkkag
      MARIADB_USER: root
      MARIADB_PASSWORD: 1234
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    image: openjdk:21-jdk
    container_name: springboot_container
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb_container:3306/ttalkkag
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_REDIS_HOST: redis  # Redis 컨테이너 이름과 동일해야 함
      SPRING_REDIS_PORT: 6379  # Redis 기본 포트
      TZ: Asia/Seoul
    volumes:
      - ./backend/backend_build:/app
      - ./uploads/profiles:/app/uploads/profiles
      - ./logs/url-mapping.json:/app/logs/url-mapping.json
    command: ["java", "-Dspring.profiles.active=dev", "-jar", "/app/ttalkkag-0.0.1-SNAPSHOT.jar"]

  history:
    image: openjdk:21-jdk
    container_name: history
    restart: always
    depends_on:
      - db
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb_container:3306/history
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      TZ: Asia/Seoul
    volumes:
      - ./history/history_build:/app
    command: ["java", "-Dspring.profiles.active=dev", "-jar", "/app/history-0.0.1-SNAPSHOT.jar"]


  redis:
    image: redis:latest
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    container_name: vue_container
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/frontend_build:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  jenkins:
    container_name: jenkins
    build:
      dockerfile: ./jenkins/Dockerfile
    environment:
      - TZ=Asia/Seoul
    user: root
    privileged: true
    volumes:
      - ./jenkins/config:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/backend_build:/var/jenkins_home/workspace/ttalkkag/backend_build
      - ./frontend/frontend_build:/var/jenkins_home/workspace/ttalkkag/frontend_build
      - ./history/history_build:/var/jenkins_home/workspace/ttalkkag/history_build
    ports:
      - 8085:8080
      - 50000:50000

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  akhq:
    image: tchiotludo/akhq:latest
    hostname: akhq
    depends_on:
      - kafka
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kafka:
              properties:
                bootstrap.servers: localhost:9092
    ports:
      - 8086:8080

volumes:
  mariadb_data:
  redis_data:
