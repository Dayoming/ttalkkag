services:
  db:
    image: mariadb:11.5
    container_name: mariadb_container
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: ttalkkag
      MARIADB_USER: root
      MARIADB_PASSWORD: 1234
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: springboot_container
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/ttalkkag
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_MAIL_USERNAME: dayomi19@gmail.com
      SPRING_MAIL_PASSWORD: cmhn cmfy mfmv wapr
      JWT_SECRET: LdqLV8d0ebKHnGek2HIOvmVtCaQHt914k7mTEZQYo33m2SUzvSVgWrBwzN2gnQ1rR0Joq90Lp9D7mFx0FLMQ1mwuV32ufB
      JWT_EXPIRATION: 7200000
      JWT_REFRESH_EXPIRATION: 1209600000
      CORS_ALLOWED_ORIGIN: http://localhost:8080
      FILE_UPLOAD_DIR: C:/ttalkkag-dev/uploads/profiles
      TZ: Asia/Seoul

  nginx:
    image: nginx:latest
    build: ./frontend
    container_name: vue_container
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mariadb_data:
